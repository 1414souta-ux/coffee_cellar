<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf8f5">
<title>Bean Cellar</title>
  <link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>


:root{
  --bg:#faf8f5;--s1:#ffffff;--s2:#f0eae2;--line:rgba(26,15,8,.10);
  --tx:#1a0f08;--tx2:rgba(26,15,8,.64);--tx3:rgba(26,15,8,.40);
  --hot:#b07820;--hot-hi:#e0a848;--ice:#3f7f9d;--ice-hi:#9fd0e6;--ink:#ffffff;--cardbd:rgba(26,15,8,.09);
  --ok:#3a6644;--warn:#9a6010;--bad:#9a3020;
  --tick:rgba(26,15,8,.2);--tickM:rgba(26,15,8,.45);
  --k1:#4a3220;--k2:#2a1a0f;--k3:#1a0f08;--kst:rgba(255,255,255,.06);
  --num:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --jp:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
html{background:var(--bg);--a:var(--hot)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--jp);-webkit-font-smoothing:antialiased;padding-bottom:110px;transition:background .25s,color .25s}
.bar{top:0}
.screen{display:none}.screen.on{display:block}
.fab{display:none;position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(88px + env(safe-area-inset-bottom));z-index:15;border:0;border-radius:99px;background:var(--hot);color:var(--ink);padding:0 24px;height:56px;font-size:15px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.35);cursor:pointer;align-items:center;gap:8px}
body[data-tab=recipes] .fab{display:flex}
.fab svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.card,.fi,.stp,.fav,.gr,.prev,.sc,.gd,.lg,.mini,.bar button,.chips button,.seg button,.gd-chip,.dn{border:1px solid var(--cardbd)}
.head p{min-height:1em}

/* nav */
.nav{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.nav button{flex:1;border:0;background:none;color:var(--tx3);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 4px;font-size:11px;font-weight:700;cursor:pointer;position:relative}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--hot)}
.nav button.on::before{content:"";position:absolute;top:-9px;width:22px;height:3px;border-radius:2px;background:var(--hot)}

#place button.on{background:var(--tx);color:var(--ink)}
.use{background:var(--a,var(--hot))}
/* shared */
.pill{flex:none;font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--s2)}
.pill.ok{color:var(--ok)}.pill.low{color:var(--warn)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tags span{font-size:11px;font-weight:600;color:var(--tx2);background:var(--s2);padding:4px 9px;border-radius:8px}
.list2{padding:0 16px;display:flex;flex-direction:column;gap:12px}
.sc{background:var(--s1);border-radius:24px;padding:18px;cursor:pointer;transition:transform .12s}
.sc:active{transform:scale(.985)}
.sc-top{display:grid;grid-template-columns:auto 1fr auto;gap:0 14px;align-items:center}
.sc-g{font:800 44px/1 var(--num);letter-spacing:-.03em;min-width:62px}
.sc-g small{font-size:15px;margin-left:2px;color:var(--tx3)}
.sc-g.low{color:var(--warn)}
.prog{height:6px;border-radius:3px;background:var(--s2);margin-top:14px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:3px;background:var(--hot)}
.prog i.low{background:var(--warn)}
.of{display:flex;justify-content:space-between;margin-top:7px;font:600 11px var(--num);color:var(--tx3)}
.memo2{margin-top:12px;font-size:13px;line-height:1.7;color:var(--tx2)}
.nb{display:flex;align-items:center;gap:8px;margin:2px 22px 0;font-size:12px;color:var(--tx2)}
.nb i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.nb button{margin-left:auto;border:0;background:none;color:var(--hot);font-size:12px;font-weight:700;cursor:pointer}
.form{padding:6px 20px 0}
.form .fl:first-child{margin-top:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fi[type=date]{min-height:50px}
.rec{background:var(--s1);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.rec .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rec b{font-size:15px;font-weight:700}
.rec .g{font:800 20px var(--num);color:var(--hot)}
.rec .m{font-size:12px;color:var(--tx3);margin-top:4px}
.rec .n{font-size:13px;color:var(--tx2);margin-top:6px;line-height:1.6;white-space:pre-line}
.rec .rl{display:inline-block;font-size:12px;font-weight:700;color:var(--hot);background:var(--s2);border-radius:10px;padding:4px 10px;margin-top:8px}
.rchip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--s2);border-radius:14px;padding:10px 14px;margin-top:18px;font-size:13px;font-weight:700;color:var(--hot)}
.rchip[hidden]{display:none}
.rchip .rn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rchip button{border:0;background:none;color:var(--tx3);font-size:16px;padding:4px 8px;cursor:pointer}
.dn{background:var(--s1);border-radius:20px;padding:16px;margin-bottom:10px;opacity:.85}
.dn b{font-size:15px}.dn .m{font-size:12px;color:var(--tx3);margin:4px 0 12px}
.dn .a{display:flex;gap:8px}
.dn .a button{flex:1;border:0;border-radius:12px;padding:11px;background:var(--s2);color:var(--tx);font-size:13px;font-weight:700;cursor:pointer}
.dn .a button.d{flex:none;color:var(--bad)}
.sheet.auto{height:auto;max-height:92vh}
.bigin{display:flex;align-items:center;gap:8px;background:var(--s1);border-radius:18px;padding:6px}
.bigin button{flex:none;width:52px;height:52px;border:0;border-radius:14px;background:var(--s2);color:var(--hot);font-size:22px;font-weight:700;cursor:pointer}
.bigin input{flex:1;min-width:0;border:0;background:none;color:var(--tx);text-align:center;font:800 40px var(--num);letter-spacing:-.02em;outline:0}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.quick button{border:0;border-radius:12px;padding:11px 0;background:var(--s2);color:var(--tx2);font:700 13px var(--num);cursor:pointer}
.quick button:active{background:var(--hot);color:var(--ink)}
.sh2{padding:4px 20px 8px}
.sh2 .two{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:20px}
.sh2 .two .use{width:auto}

/* gram dial (dark/light aware) */
.gd{--gd-a:var(--hot);--gd-hi:var(--hot-hi);--gd-soft:color-mix(in srgb,var(--hot) 16%,transparent);position:relative;background:var(--s1);border-radius:26px;padding:14px 14px 12px}
.gd[data-mode="ice"]{--gd-a:var(--ice);--gd-hi:var(--ice-hi);--gd-soft:color-mix(in srgb,var(--ice) 16%,transparent)}
.gd-seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--s2);border-radius:99px;padding:3px}
.gd-seg button{position:relative;z-index:1;height:38px;border:0;background:transparent;color:var(--tx2);font:800 14px var(--num);letter-spacing:.06em;border-radius:99px;cursor:pointer}
.gd-seg button[aria-checked="true"]{color:var(--ink)}
.gd-pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:99px;background:var(--gd-a);transition:transform .22s cubic-bezier(.2,.8,.2,1),background .22s}
.gd[data-mode="ice"] .gd-pill{transform:translateX(100%)}
.gd-dial{position:relative;width:min(100%,300px);aspect-ratio:1;margin:8px auto -26px;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;outline:none;cursor:grab}
.gd-dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gd-ringbg{stroke:var(--s2)}
.gd-ringfg{stroke:var(--gd-a);transition:stroke .2s}
.gd-tk{stroke:var(--tick);transition:stroke .1s}
.gd-tk.major{stroke:var(--tickM)}
.gd-tk.on{stroke:var(--gd-a)}
.gd-lbl{fill:var(--tx3);font-family:var(--num);font-weight:700;font-size:10px}
.gd-pdot{fill:var(--gd-a);opacity:.7}
.gd-knob{transform-origin:160px 160px;transition:transform .09s ease-out}
.gd-dial.dragging .gd-knob{transition:none}
#gd-kg stop:nth-child(1){stop-color:var(--k1)}#gd-kg stop:nth-child(2){stop-color:var(--k2)}#gd-kg stop:nth-child(3){stop-color:var(--k3)}
.gd-kbody{fill:url(#gd-kg);stroke:var(--kst);stroke-width:2}
.gd-grip{stroke:rgba(255,255,255,.06);stroke-width:2}
.gd-kind{fill:var(--gd-hi);transition:fill .2s}
.gd-kshadow{opacity:.35}
.gd-hit{position:absolute;inset:0;border-radius:50%}
.gd-hit.ring{touch-action:none;z-index:2}
.gd-hit.knob{inset:14%;touch-action:pan-y;z-index:3}
.gd-center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center}
.gd-num{font:800 58px/.95 var(--num);color:var(--gd-hi);letter-spacing:-.03em;font-variant-numeric:tabular-nums;transition:color .2s}
.gd-unit{font:800 20px var(--num);color:rgba(255,235,210,.55);margin-left:3px}
.gd-hint{font-size:11px;color:rgba(255,235,210,.5);margin-top:6px}
.gd-dial:focus-visible .gd-kbody{stroke:var(--gd-a)}
.gd-presets{position:relative;z-index:1;display:flex;gap:8px}
.gd-chip{flex:1;height:42px;border-radius:99px;background:var(--s2);color:var(--tx2);font:800 14px var(--num);cursor:pointer;border:0}
.gd-chip.on{background:var(--tx);color:var(--ink)}
.gd-ratio{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.gd-rlabel{font-size:12px;font-weight:600;color:var(--tx2)}
.gd-rbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--s2);color:var(--gd-a);font:700 20px var(--num);cursor:pointer}
.gd-rbtn:disabled{opacity:.3}
.gd-rval{font:800 28px var(--num);color:var(--gd-a);min-width:3.6ch;text-align:center;font-variant-numeric:tabular-nums}
.gd-rchips{display:flex;justify-content:center;gap:6px;margin-top:8px}
.gd-rchip{height:30px;padding:0 12px;border-radius:99px;border:0;background:var(--s2);color:var(--tx2);font:700 12px var(--num);cursor:pointer}
.gd-rchip.on{background:var(--gd-soft);color:var(--gd-a)}
.gd-sub{text-align:center;font:700 13px var(--num);color:var(--tx2);margin-top:10px;min-height:16px}
.gd-opts{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--tx3)}
.gd-opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.gd-opts input{accent-color:var(--gd-a)}
.gd-haptic{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#gd-wrap[hidden]{display:none!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a,var(--hot));outline-offset:2px}
[data-mode=hot]{--a:var(--hot)}[data-mode=ice]{--a:var(--ice)}
.app{max-width:480px;margin:0 auto}

.head{padding:52px 22px 6px}
.head h1{margin:0;font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.head p{margin:8px 0 0;color:var(--tx2);font-size:13px}
.bar{position:sticky;top:24px;z-index:10;padding:12px 16px 14px;background:linear-gradient(var(--bg) 70%,transparent);display:flex;gap:6px}
.bar button{flex:1;border:0;background:var(--s1);color:var(--tx2);border-radius:99px;padding:11px 0;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.bar button.on{background:var(--tx);color:var(--ink)}

.list{padding:0 16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--s1);border-radius:24px;overflow:hidden;transition:background .2s}
.card.open{background:var(--s2)}
.top{display:grid;grid-template-columns:auto 1fr auto;gap:0 14px;align-items:center;padding:16px 8px 6px 18px;cursor:pointer}
.dose{font:800 44px/1 var(--num);color:var(--a);letter-spacing:-.03em;min-width:58px}
.dose small{font-size:15px;font-weight:700;margin-left:2px;opacity:.8}
.nm{min-width:0}
.nm b{display:block;font-size:16px;font-weight:700;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:5px;font:600 12px var(--num);color:var(--tx2)}
.star{width:48px;height:48px;border:0;background:none;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.star svg{width:24px;height:24px;fill:none;stroke:var(--tx3);stroke-width:1.8;stroke-linejoin:round;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.star.on svg{fill:var(--a);stroke:var(--a)}
.star.pop svg{transform:scale(1.35)}
.spark{display:block;width:100%;height:34px;padding:0 18px 16px;margin-top:-2px}
.spark svg{width:100%;height:100%;overflow:visible}

.body{display:none;padding:2px 18px 18px}
.card.open .body{display:block}
.card.open .spark{display:none}
.chart{margin:4px -4px 4px}
.chart svg{width:100%;display:block;overflow:visible}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:6px 0 4px}
.stats div{padding:6px 0 6px 12px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0;padding-left:0}
.stats b{display:block;font:800 20px/1.1 var(--num);letter-spacing:-.02em;white-space:nowrap}
.stats i{font-style:normal;font-size:11px;color:var(--tx3);display:block;margin-top:2px}
.steps{margin:16px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.steps li{display:grid;grid-template-columns:54px 64px 1fr;align-items:baseline;gap:6px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.steps.tv li{grid-template-columns:54px 64px 1fr auto}.steps .c{font:800 14px var(--num);color:var(--tx);background:var(--bg);padding:3px 9px;border-radius:99px}
.steps .t{font:700 14px var(--num);color:var(--tx2)}
.steps .g{font:800 16px var(--num);color:var(--a)}
.note{margin-top:14px;font-size:13px;line-height:1.7;color:var(--tx2)}
.note b{color:var(--tx);font-weight:600;margin-right:8px}
.acts{display:flex;gap:10px;margin-top:18px}
.use{flex:1;border:0;border-radius:16px;padding:16px;background:var(--a);color:var(--ink);font-size:15px;font-weight:800;cursor:pointer}
.use:active{transform:scale(.98)}
.ghost{border:0;background:var(--s1);border-radius:16px;padding:0 20px;font-size:14px;font-weight:600;cursor:pointer;color:var(--tx)}
.empty{text-align:center;color:var(--tx3);font-size:14px;line-height:1.8;padding:64px 20px}

.fab svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;width:100%;max-width:480px;height:94vh;transform:translate(-50%,102%);background:var(--bg);border-radius:28px 28px 0 0;display:flex;flex-direction:column;transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.sheet.on{transform:translate(-50%,0)}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.sh-head h2{margin:0;font-size:20px;font-weight:800}
.sh-x{width:40px;height:40px;border:0;border-radius:50%;background:var(--s1);cursor:pointer;font-size:18px;color:var(--tx2)}
.sh-body{flex:1;overflow:auto;padding:4px 20px 24px;-webkit-overflow-scrolling:touch}
.sh-foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.sh-foot .use{width:100%}
.fl{display:block;margin:22px 0 9px;font-size:12px;font-weight:600;color:var(--tx2)}
.fi{width:100%;border:0;background:var(--s1);color:var(--tx);border-radius:14px;padding:14px 15px;font-size:16px;font-family:inherit}
.fi::placeholder{color:var(--tx3)}
.fi:focus{outline:2px solid var(--a);outline-offset:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:0;border-radius:16px;padding:15px;background:var(--s1);font-size:16px;font-weight:800;color:var(--tx3);cursor:pointer;transition:.15s}
.seg button.on[data-v=hot]{background:var(--hot);color:var(--ink)}
.seg button.on[data-v=ice]{background:var(--ice);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:0;border-radius:99px;background:var(--s1);color:var(--tx2);padding:11px 17px;font-size:14px;font-weight:600;cursor:pointer}
.chips button.on{background:var(--tx);color:var(--ink)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stp{background:var(--s1);border-radius:16px;padding:10px 4px 6px;text-align:center}
.stp .v{font:800 24px/1.2 var(--num);letter-spacing:-.02em}
.stp .u{font-size:11px;color:var(--tx3);margin-bottom:2px}
.stp div.b{display:grid;grid-template-columns:1fr 1fr}
.stp button{border:0;background:none;height:42px;font-size:22px;color:var(--a);cursor:pointer;font-weight:700}
.stp button:active{background:var(--s2);border-radius:12px}
.prev{margin-top:14px;background:var(--s1);border-radius:18px;padding:14px 14px 10px}
.prev .sum{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:12px;color:var(--tx2)}
.prev .sum b{font:800 22px var(--num);color:var(--tx)}
.rows{display:flex;flex-direction:column;gap:8px}
.rows .r{display:grid;grid-template-columns:var(--cols,64px 72px 1fr 34px);gap:8px;align-items:center}
.rows .r.h{font-size:11px;color:var(--tx3)}
.rows .fi{padding:11px 10px;font-size:15px;text-align:center;font-family:var(--num);font-weight:700}
.rows .fi.l{text-align:left;font-family:var(--jp);font-weight:500}
.rows .x{border:0;background:none;color:var(--tx3);font-size:18px;height:40px;cursor:pointer}
.mini{border:0;background:var(--s1);color:var(--tx);border-radius:12px;padding:11px 14px;font-size:13px;font-weight:600;cursor:pointer}
.mini.a{color:var(--a)}
.fav{display:flex;align-items:center;justify-content:space-between;margin-top:22px;background:var(--s1);border-radius:16px;padding:14px 16px;font-size:15px;font-weight:600}
.sw{width:52px;height:32px;border-radius:16px;border:0;background:var(--s2);position:relative;cursor:pointer;transition:.2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--tx);transition:.2s}
.sw.on{background:var(--a)}.sw.on::after{left:24px;background:var(--ink)}
.rows.tv{--cols:54px 60px 54px 1fr 30px}
.gr{background:var(--s1);border-radius:18px;padding:16px 16px 12px}
.gr .top2{display:flex;align-items:baseline;justify-content:space-between}
.gr .big{font:800 44px/1 var(--num);letter-spacing:-.03em;color:var(--a)}
.gr .nmv{font-size:13px;color:var(--tx2);font-weight:600}
.gr .ctl{display:flex;align-items:center;gap:10px;margin-top:14px}
.gr .ctl button{flex:none;width:46px;height:46px;border:0;border-radius:14px;background:var(--s2);font-size:13px;font-weight:800;font-family:var(--num);color:var(--a);cursor:pointer}
.gr .ctl button:active{transform:scale(.94)}
.gr .rng{display:flex;justify-content:space-between;font:700 11px var(--num);color:var(--tx3);margin-top:6px;padding:0 60px}
input[type=range].sl{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:44px;background:transparent;touch-action:pan-y;margin:0}

<script>
// ── CONFIG ──
const PROXY   = 'https://notion-proxy.1414souta.workers.dev';
const STOCK_DB = '77a292ef-511d-41c0-857b-62cd8c15a851';
const LOG_DB   = '38b285ba-a83a-801a-96f7-cd614dcd877e';
const TK = 'notion_token_v2';
const LOG_LK = 'bean_log_v4'; // local log cache

const getToken = () => localStorage.getItem(TK) || '';
const loadLogCache = () => { try{return JSON.parse(localStorage.getItem(LOG_LK)||'[]')}catch{return[]} };
const saveLogCache = d => localStorage.setItem(LOG_LK, JSON.stringify(d));

// ── NOTION API ──
async function nAPI(method, path, body) {
  const token = getToken();
  if (!token) return null;
  try {
    const r = await fetch(PROXY + path, {
      method,
      headers: {
        'Authorization': 'Bearer ' + token,
        'Notion-Version': '2022-06-28',
        'Content-Type': 'application/json'
      },
      body: body ? JSON.stringify(body) : undefined
    });
    if (!r.ok) { console.error(r.status, await r.text()); return null; }
    return r.json();
  } catch(e) { console.error(e); return null; }
}

// ── STOCK: READ from Notion ──
async function fetchStock() {
  const res = await nAPI('POST', '/v1/databases/' + STOCK_DB + '/query', {
    filter: { property: 'ステータス', select: { does_not_equal: '使い切り' } },
    sorts: [{ timestamp: 'created_time', direction: 'descending' }],
    page_size: 100
  });
  if (!res) return null;
  return res.results.map(p => ({
    id: p.id,
    name: p.properties['豆の名前']?.title?.[0]?.plain_text || '',
    roaster: p.properties['ロースター']?.select?.name || '',
    roastDate: p.properties['焙煎日']?.date?.start || '',
    totalGrams: p.properties['購入グラム']?.number || 0,
    remainGrams: p.properties['残量（g）']?.number ?? 0,
    roastLevel: p.properties['焙煎度']?.select?.name || '',
    process: p.properties['精製方法']?.select?.name || '',
    status: p.properties['ステータス']?.select?.name || 'IN STOCK',
    memo: p.properties['メモ']?.rich_text?.[0]?.plain_text || ''
  }));
}

async function fetchDone() {
  const res = await nAPI('POST', '/v1/databases/' + STOCK_DB + '/query', {
    filter: { property: 'ステータス', select: { equals: '使い切り' } },
    sorts: [{ timestamp: 'last_edited_time', direction: 'descending' }],
    page_size: 50
  });
  if (!res) return null;
  return res.results.map(p => ({
    id: p.id,
    name: p.properties['豆の名前']?.title?.[0]?.plain_text || '',
    roaster: p.properties['ロースター']?.select?.name || '',
    totalGrams: p.properties['購入グラム']?.number || 0,
    roastLevel: p.properties['焙煎度']?.select?.name || '',
    process: p.properties['精製方法']?.select?.name || '',
    memo: p.properties['メモ']?.rich_text?.[0]?.plain_text || ''
  }));
}

// ── STOCK: WRITE to Notion ──
async function updateStock(pageId, remainGrams, memo, status) {
  const statusMap = { 'IN STOCK': '在庫あり', 'LOW': '残り少ない', 'DONE': '使い切り' };
  return nAPI('PATCH', '/v1/pages/' + pageId, {
    properties: {
      '残量（g）': { number: remainGrams },
      'メモ': { rich_text: [{ text: { content: memo || '' } }] },
      'ステータス': { select: { name: statusMap[status] || '在庫あり' } }
    }
  });
}

async function createStock(bean) {
  const props = {
    '豆の名前': { title: [{ text: { content: bean.name } }] },
    '購入グラム': { number: bean.totalGrams },
    '残量（g）': { number: bean.totalGrams },
    'ステータス': { select: { name: '在庫あり' } }
  };
  if (bean.roaster) props['ロースター'] = { select: { name: bean.roaster } };
  if (bean.roastDate) props['焙煎日'] = { date: { start: bean.roastDate } };
  if (bean.roastLevel) props['焙煎度'] = { select: { name: bean.roastLevel } };
  if (bean.process) props['精製方法'] = { select: { name: bean.process } };
  if (bean.memo) props['メモ'] = { rich_text: [{ text: { content: bean.memo } }] };
  return nAPI('POST', '/v1/pages', { parent: { database_id: STOCK_DB }, properties: props });
}

async function deleteStock(pageId) {
  return nAPI('PATCH', '/v1/pages/' + pageId, { archived: true });
}

// ── LOG: WRITE to Notion ──
async function createLog(entry) {
  const props = {
    'コーヒーの名前': { title: [{ text: { content: entry.name } }] },
    'ひとことメモ': { rich_text: [{ text: { content: entry.memo || '' } }] },
    '記録日時': { date: { start: new Date().toISOString() } }
  };
  if (entry.place) props['飲んだ場所'] = { select: { name: entry.place } };
  if (entry.grams) props['使用グラム'] = { number: entry.grams };
  if (entry.roaster) props['ロースター'] = { select: { name: entry.roaster } };
  if (entry.roastLevel) props['焙煎度'] = { select: { name: entry.roastLevel } };
  if (entry.process) props['精製方法'] = { select: { name: entry.process } };
  return nAPI('POST', '/v1/pages', { parent: { database_id: LOG_DB }, properties: props });
}

// ── NOTION STATUS ──
function updateNStatus() {
  const t = getToken();
  document.getElementById('nbar').classList.toggle('err', !t);
  document.getElementById('nstatus').textContent = t ? 'Notion に接続済み' : 'Notion 未接続（トークンを設定してください）';
}
function setupNotion() {
  const cur = getToken();
  const t = prompt('Notion Integration Token\n（secret_xxxxx または ntn_xxxxx の形式）', cur || '');
  if (t !== null) {
    t.trim() ? localStorage.setItem(TK, t.trim()) : localStorage.removeItem(TK);
    updateNStatus();
    showToast('設定を保存しました');
    if (t.trim()) { loadStock(); loadDone(); }
  }
}

// ── STATE ──
let stockData = [];
let selectedBeanId = null;
let selectedPlace = '家';
let editingPageId = null;
let currentTab = 'stock';
const TABS = ['stock','log','recipes','new','done'];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── NAVIGATION ──
function go(tab) {
  currentTab = tab;
  document.body.dataset.tab = tab;
  TABS.forEach(k => document.getElementById('sc-' + k).classList.toggle('on', k === tab));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.go === tab));
  window.scrollTo(0, 0);
  if (tab === 'stock') loadStock();
  if (tab === 'log') { renderPicker(); renderLogHist(); }
  if (tab === 'recipes') renderR();
  if (tab === 'done') loadDone();
}
document.getElementById('nav').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });

// ── HELPERS ──
const daysSince = d => d ? Math.floor((Date.now() - new Date(d)) / 86400000) : null;
const skeletonHTML = () => '<div class="skel"></div>'.repeat(3);

// ── STOCK SCREEN ──
async function loadStock() {
  const el = document.getElementById('stock-list');
  el.innerHTML = skeletonHTML();
  if (!getToken()) {
    el.innerHTML = '<div class="empty">Notionのトークンを設定してください。<br><button onclick="setupNotion()">接続設定</button></div>';
    document.getElementById('stock-sub').textContent = 'Notion未接続';
    return;
  }
  const beans = await fetchStock();
  if (!beans) {
    el.innerHTML = '<div class="empty">Notionに接続できませんでした。<br>トークンとプロキシを確認してください。</div>';
    return;
  }
  stockData = beans;
  const totalG = beans.reduce((s, b) => s + (b.remainGrams || 0), 0);
  document.getElementById('stock-sub').textContent = `残り ${Math.round(totalG * 10) / 10}g　${beans.length}袋`;
  if (!beans.length) {
    el.innerHTML = '<div class="empty">在庫がありません。<br>「追加」から豆を登録できます。</div>';
    return;
  }
  el.innerHTML = beans.map(b => {
    const pct = b.totalGrams ? Math.max(0, Math.min(100, Math.round((b.remainGrams / b.totalGrams) * 100))) : 0;
    const days = daysSince(b.roastDate);
    const low = b.remainGrams <= b.totalGrams * 0.2;
    const tags = [b.roastLevel, b.process].filter(Boolean);
    return `<div class="sc" data-bean="${b.id}" role="button" tabindex="0">
      <div class="sc-top"><div class="sc-g ${low ? 'low' : ''}">${b.remainGrams}<small>g</small></div>
        <div class="nm"><b>${esc(b.name)}</b><div class="meta">${b.roaster ? `<span>${esc(b.roaster)}</span>` : ''}${days !== null ? `<span>焙煎から${days}日</span>` : ''}</div></div>
        <span class="pill ${low ? 'low' : 'ok'}">${low ? '残り少ない' : '在庫あり'}</span></div>
      <div class="prog"><i class="${low ? 'low' : ''}" style="width:${pct}%"></i></div>
      <div class="of"><span>${pct}%</span><span>${b.totalGrams}g入り</span></div>
      ${tags.length ? `<div class="tags">${tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
      ${b.memo ? `<div class="memo2">${esc(b.memo)}</div>` : ''}
    </div>`;
  }).join('');
}
document.getElementById('stock-list').addEventListener('click', e => { const c = e.target.closest('[data-bean]'); if (c) openModal(c.dataset.bean); });
document.getElementById('stock-list').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-bean]')) { e.preventDefault(); e.target.click(); } });

// ── STOCK MODAL ──
function openModal(id) {
  const b = stockData.find(x => x.id === id);
  if (!b) return;
  editingPageId = id;
  const days = daysSince(b.roastDate);
  document.getElementById('msheet').innerHTML = `<div style="width:36px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 6px"></div>
    <div class="sh-head"><h2>${esc(b.name)}</h2><button class="sh-x" data-mx="1" aria-label="閉じる">✕</button></div>
    <div class="sh2"><div class="meta" style="margin:0 0 4px">${b.roaster ? `<span>${esc(b.roaster)}</span>` : ''}${days !== null ? `<span>焙煎から${days}日</span>` : ''}</div>
    <label class="fl">残りグラム</label>
    <div class="bigin"><button data-mg="-1" aria-label="1g減らす">−</button><input id="m-g" type="number" min="0" inputmode="numeric" value="${b.remainGrams}" aria-label="残りグラム"><button data-mg="1" aria-label="1g増やす">＋</button></div>
    <div class="quick"><button data-ms="13">−13g</button><button data-ms="14">−14g</button><button data-ms="16">−16g</button><button data-ms="18">−18g</button></div>
    <label class="fl" for="m-memo">メモ</label><textarea class="fi" id="m-memo" style="min-height:76px;resize:none;line-height:1.6" placeholder="メモを編集">${esc(b.memo)}</textarea>

/* 注ぎ曲線：横=時間 縦=累計の湯量。注ぐ間は立ち上がり、待つ間は水平 */
function pts(r,w,h,pad){
  const W=water(r)||1,E=Math.max(r.end,(r.steps.at(-1)?.t||0)+20);
  const X=t=>pad+(w-pad*2)*t/E,Y=g=>h-pad-(h-pad*2)*Math.min(g,W)/W;
  let p=[[X(0),Y(0)]],prev=0,dots=[];
  r.steps.forEach(s=>{p.push([X(s.t),Y(prev)]);const te=s.t+Math.min(12,Math.max(6,(s.g-prev)/6));p.push([X(te),Y(s.g)]);dots.push({x:X(te),y:Y(s.g),g:s.g,t:s.t});prev=s.g});
  p.push([X(E),Y(prev)]);
  return{p,dots,X,Y,E,W};
}
const path=p=>p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
function spark(r){
  const w=300,h=34,{p}=pts(r,w,h,2),d=path(p),id='g'+r.id+Math.random().toString(36).slice(2,6);
  return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--a)" stop-opacity=".35"/><stop offset="1" stop-color="var(--a)" stop-opacity="0"/></linearGradient></defs>
  <path d="${d}L${w-2} ${h-2}L2 ${h-2}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="var(--a)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function chart(r,h=120){
  const w=340,{p,dots,X,E,W}=pts(r,w,h,20),d=path(p),id='c'+Math.random().toString(36).slice(2,7);
  const ticks=[0,.5,1].map(f=>{const t=Math.round(E*f);return`<text x="${X(t)}" y="${h+14}" fill="var(--tx3)" font-size="10" text-anchor="${f===0?'start':f===1?'end':'middle'}" font-family="var(--num)" font-weight="700">${mmss(t)}</text>`}).join('');
  return`<svg viewBox="0 0 ${w} ${h+20}" role="img" aria-label="注ぎ方の曲線"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--a)" stop-opacity=".4"/><stop offset="1" stop-color="var(--a)" stop-opacity="0"/></linearGradient></defs>
  <line x1="20" x2="${w-20}" y1="${h-20}" y2="${h-20}" stroke="var(--line)"/>
  <path d="${d}L${w-20} ${h-20}L20 ${h-20}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="var(--a)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${dots.map(o=>`<circle cx="${o.x}" cy="${o.y}" r="4.5" fill="var(--bg)" stroke="var(--a)" stroke-width="2.5"/><text x="${Math.min(o.x,w-18)}" y="${o.y-11}" text-anchor="middle" fill="var(--tx)" font-size="11" font-weight="800" font-family="var(--num)">${o.g}</text>`).join('')}${ticks}</svg>`;
}

const STEP={dose:.5,ratio:1,temp:1,end:5},MIN={dose:8,ratio:8,temp:70,end:60},MAX={dose:40,ratio:25,temp:100,end:600};
$('#sheet').addEventListener('click',e=>{

// ── GRAM DIAL（ダイヤル式グラム入力 / 0.5g刻み・音・振動つき）──
// 値は window.GramDial.value で参照する。HOT/ICE・比率は画面上の目安計算用で、Notionには保存しない。
(() => {
  const root = document.getElementById('gd');
  const q = (k) => root.querySelector(`[data-r="${k}"]`);
  const dial = document.getElementById('gd-dial'), knob = q('knob'), num = q('num'), sub = q('sub');
  const MIN = 8, MAX = 25, STEP = 0.5, SWEEP = 270, START = -SWEEP / 2;
  const PRESETS = {hot: [8, 13, 14, 20], ice: [15, 16, 18, 20]};
  const ICE_SHARE = 0.5, R_MIN = 12, R_MAX = 18, R_STEP = 0.5, RATIO_PRESETS = [14, 15, 16, 17];
  const DETENT_PULL = 0.65;
  const LS = 'bc_gd_v1';
  const C = 160, R_RING = 128, R_TICK_IN = 112, R_TICK_OUT = 120, R_LBL = 145;
  const fmtR = (r) => (Number.isInteger(r) ? r : r.toFixed(1));
  const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
  const snap = (v) => clamp(Math.round(v / STEP) * STEP, MIN, MAX);

  // 前回の設定を復元（保存できない環境でも動く）
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) {}
  let mode = saved.m === 'ice' ? 'ice' : 'hot';
  let value = snap(Number.isFinite(saved.v) ? saved.v : 14);
  const ratio = {
    hot: clamp(Math.round((saved.r && +saved.r.hot || 15) / R_STEP) * R_STEP, R_MIN, R_MAX),
    ice: clamp(Math.round((saved.r && +saved.r.ice || 15) / R_STEP) * R_STEP, R_MIN, R_MAX),
  };
  if (saved.snd === false) q('snd').checked = false;
  if (saved.vib === false) q('vib').checked = false;
  function persist() {
    try { localStorage.setItem(LS, JSON.stringify({v: value, m: mode, r: ratio, snd: q('snd').checked, vib: q('vib').checked})); } catch (e) {}
  }

  let rawAngle = toAngle(value), dragging = false;
  function toAngle(v) { return START + ((v - MIN) / (MAX - MIN)) * SWEEP; }
  function toValue(a) { return MIN + ((a - START) / SWEEP) * (MAX - MIN); }
  const clampA = (a) => clamp(a, START, START + SWEEP);
  function pt(r, deg) { const t = (deg - 90) * Math.PI / 180; return [C + r * Math.cos(t), C + r * Math.sin(t)]; }
  function arc(r, a0, a1) { const [x0, y0] = pt(r, a0), [x1, y1] = pt(r, a1); return `M${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`; }

  // 目盛り・ラベル・グリップ
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  q('bg').setAttribute('d', arc(R_RING, START, START + SWEEP));
  const tickEls = [];
  for (let i = 0, n = Math.round((MAX - MIN) / STEP); i <= n; i++) {
    const v = MIN + i * STEP, a = toAngle(v), major = Number.isInteger(v);
    const [x0, y0] = pt(major ? R_TICK_IN - 4 : R_TICK_IN, a), [x1, y1] = pt(R_TICK_OUT, a);
    const l = mk('line', {x1: x0, y1: y0, x2: x1, y2: y1, class: 'gd-tk' + (major ? ' major' : ''), 'stroke-width': major ? 2 : 1.2, 'stroke-linecap': 'round'});
    q('ticks').appendChild(l); tickEls.push(l);
    if (v % 2 === 0 || v === MAX) {
      const [lx, ly] = pt(R_LBL, a);
      const t = mk('text', {x: lx, y: ly + 3.5, 'text-anchor': 'middle', class: 'gd-lbl'}); t.textContent = v; q('ticks').appendChild(t);
    }
  }
  for (let i = 0; i < 36; i++) {
    const [x0, y0] = pt(84, i * 10), [x1, y1] = pt(94, i * 10);
    q('grip').appendChild(mk('line', {x1: x0, y1: y0, x2: x1, y2: y1, class: 'gd-grip'}));
  }

  // 音: 乾いた短い「チッ」（1kHz以下なし・最大25回/秒）。ICEは高め
  let ctx = null, out = null, lastTick = 0;
  const bufs = {minor: [], major: [], stop: null};
  function synth(sr, {dur, modes, tAmp, seed}) {
    let s = seed; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647) * 2 - 1;
    const len = Math.floor(sr * dur), buf = new Float32Array(len), tLen = Math.floor(sr * 0.0003);
    for (let i = 0; i < len; i++) {
      const t = i / sr; let x = i < tLen ? rnd() * tAmp * (1 - i / tLen) : 0;
      for (const m of modes) x += m.amp * Math.exp(-t / m.decay) * Math.sin(2 * Math.PI * m.f * t);
      buf[i] = x * Math.min(1, (len - i) / (sr * 0.001));
    }
    let pk = 0; for (const v of buf) pk = Math.max(pk, Math.abs(v));
    for (let i = 0; i < len; i++) buf[i] *= 0.8 / pk;
    return buf;
  }
  const toBuf = (arr) => { const b = ctx.createBuffer(1, arr.length, ctx.sampleRate); b.getChannelData(0).set(arr); return b; };
  function buildSounds() {
    const sr = ctx.sampleRate;
    for (let k = 0; k < 6; k++) {
      const j = 1 + (k - 2.5) * 0.012;
      bufs.minor.push(toBuf(synth(sr, {dur: 0.004, tAmp: 0.5, seed: 11 + k, modes: [{f: 4800 * j, decay: 0.0009, amp: 0.45}, {f: 7600 * j, decay: 0.0006, amp: 0.2}]})));
      bufs.major.push(toBuf(synth(sr, {dur: 0.006, tAmp: 0.7, seed: 97 + k, modes: [{f: 3300 * j, decay: 0.0014, amp: 0.55}, {f: 5600 * j, decay: 0.0009, amp: 0.25}]})));
    }
    bufs.stop = toBuf(synth(sr, {dur: 0.008, tAmp: 0.6, seed: 5, modes: [{f: 2300, decay: 0.0022, amp: 0.5}, {f: 4100, decay: 0.0012, amp: 0.2}]}));
  }
  function unlockAudio() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC({latencyHint: 'interactive'});
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1200;
    const master = ctx.createGain(); master.gain.value = 0.85;
    out = hp; hp.connect(master).connect(ctx.destination); buildSounds();
  }
  function play(buf, gain, rate) {
    const src = ctx.createBufferSource(); src.buffer = buf; src.playbackRate.value = rate;
    const g = ctx.createGain(); g.gain.value = gain; src.connect(g).connect(out); src.start();
  }
  const modePitch = () => (mode === 'ice' ? 1.35 : 1);
  function click(major, gap) {
    if (!q('snd').checked || !ctx) return;
    const fast = clamp((120 - gap) / 80, 0, 1), list = major ? bufs.major : bufs.minor;
    play(list[(Math.random() * list.length) | 0], (major ? 0.9 : 0.6) * (1 - fast * 0.4) * (mode === 'ice' ? 0.85 : 1), modePitch() * (0.985 + Math.random() * 0.03));
  }
  function endStop() { if (q('snd').checked && ctx) play(bufs.stop, 0.7, modePitch()); }
  function buzz(major) {
    if (!q('vib').checked) return;
    if (navigator.vibrate) navigator.vibrate(major ? 9 : 4); else q('hs').click();   // iOS 18+ は switch の切替で触覚
  }
  function feedback(v) {
    const t = performance.now(), gap = t - lastTick; if (gap < 40) return; lastTick = t;
    const major = Number.isInteger(v); click(major, gap); buzz(major);
  }

  // 描画
  function render() {
    const detentA = toAngle(value);
    knob.style.transform = `rotate(${dragging ? detentA + (rawAngle - detentA) * (1 - DETENT_PULL) : detentA}deg)`;
    q('fg').setAttribute('d', value > MIN ? arc(R_RING, START, detentA) : '');
    num.textContent = value.toFixed(1);
    tickEls.forEach((t, i) => t.classList.toggle('on', MIN + i * STEP <= value));
    root.dataset.mode = mode;
    root.querySelectorAll('.gd-seg button').forEach((b) => b.setAttribute('aria-checked', b.dataset.mode === mode));
    root.querySelectorAll('.gd-chip').forEach((c) => c.classList.toggle('on', +c.dataset.v === value));
    const R = ratio[mode], total = Math.round(value * R);
    q('rval').textContent = `1:${fmtR(R)}`;
    q('rminus').disabled = R <= R_MIN; q('rplus').disabled = R >= R_MAX;
    root.querySelectorAll('.gd-rchip').forEach((c) => c.classList.toggle('on', +c.dataset.r === R));
    if (mode === 'hot') sub.textContent = `湯 ${total}ミリリットル`;
    else { const ice = Math.round(total * ICE_SHARE); sub.textContent = `湯 ${total - ice}ミリリットル ＋ 氷 ${ice}グラム`; }
    dial.setAttribute('aria-valuenow', value); dial.setAttribute('aria-valuetext', value + 'グラム');
    persist();
  }
  function setValue(v) {
    const s = snap(v);
    if (s !== value) {
      const dir = Math.sign(s - value), n = Math.round(Math.abs(s - value) / STEP);
      let crossedMajor = false;
      for (let k = 1; k <= n; k++) if (Number.isInteger(value + dir * STEP * k)) crossedMajor = true;
      feedback(crossedMajor ? Math.round(s) : s);
      value = s;
    }
    render();
  }

  // プリセット（目盛りを1つずつカチカチ送る）
  let anim = null;
  function animateTo(target) {
    clearInterval(anim);
    anim = setInterval(() => {
      if (value === target) { clearInterval(anim); return; }
      setValue(value + Math.sign(target - value) * STEP); rawAngle = toAngle(value);
    }, 28);
  }
  function buildPresets() {
    q('presets').innerHTML = ''; q('pdots').innerHTML = '';
    PRESETS[mode].forEach((p) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'gd-chip'; b.textContent = p + 'g'; b.dataset.v = p;
      b.onclick = () => { unlockAudio(); animateTo(p); };
      q('presets').appendChild(b);
      const [x, y] = pt(R_RING, toAngle(p));
      q('pdots').appendChild(mk('circle', {cx: x, cy: y, r: 2.5, class: 'gd-pdot'}));
    });
  }
  root.querySelectorAll('.gd-seg button').forEach((b) => {
    b.onclick = () => {
      if (b.dataset.mode === mode) return;
      unlockAudio(); mode = b.dataset.mode; buildPresets(); lastTick = 0; feedback(1); render();
    };
  });

  // 比率
  function setRatio(r) {
    const n = clamp(Math.round(r / R_STEP) * R_STEP, R_MIN, R_MAX);
    if (n === ratio[mode]) return;
    unlockAudio(); ratio[mode] = n; lastTick = 0; feedback(Number.isInteger(n) ? 1 : 0.5); render();
  }
  q('rminus').onclick = () => setRatio(ratio[mode] - R_STEP);
  q('rplus').onclick = () => setRatio(ratio[mode] + R_STEP);
  RATIO_PRESETS.forEach((r) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'gd-rchip'; b.dataset.r = r; b.textContent = '1:' + r;
    b.onclick = () => setRatio(r); q('rchips').appendChild(b);
  });
  q('snd').onchange = q('vib').onchange = persist;

  // ドラッグ（円周方向）
  let lastPtr = 0, hitEdge = false;
  function ptrAngle(e) {
    const r = dial.getBoundingClientRect();
    return Math.atan2(e.clientX - (r.left + r.width / 2), -(e.clientY - (r.top + r.height / 2))) * 180 / Math.PI;
  }
  // 外側の輪＝円周ドラッグ（縦スクロールより優先）／中央のつまみ＝左右スワイプ（縦はページのスクロールに回す）
  let dragMode = 'ring', lastX = 0;
  const X_DEG = 0.9;   // 横1pxあたりの回転角
  dial.addEventListener('pointerdown', (e) => {
    unlockAudio(); clearInterval(anim); dragging = true; dial.classList.add('dragging');
    dragMode = e.target.closest('.gd-hit.knob') ? 'knob' : 'ring'; lastX = e.clientX;
    dial.setPointerCapture(e.pointerId); lastPtr = ptrAngle(e); rawAngle = toAngle(value); render();
  });
  dial.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    let d;
    if (dragMode === 'knob') { d = (e.clientX - lastX) * X_DEG; lastX = e.clientX; }
    else {
      const a = ptrAngle(e); d = a - lastPtr;
      if (d > 180) d -= 360; if (d < -180) d += 360;
      lastPtr = a;
    }

    hitEdge = atEdge; rawAngle = next; setValue(toValue(rawAngle));
  });
  const end = () => { if (!dragging) return; dragging = false; hitEdge = false; dial.classList.remove('dragging'); rawAngle = toAngle(value); render(); };
  dial.addEventListener('pointerup', end); dial.addEventListener('pointercancel', end);
  dial.addEventListener('wheel', (e) => { e.preventDefault(); unlockAudio(); setValue(value + (e.deltaY < 0 ? STEP : -STEP)); rawAngle = toAngle(value); }, {passive: false});
  dial.addEventListener('keydown', (e) => {
    const map = {ArrowRight: STEP, ArrowUp: STEP, ArrowLeft: -STEP, ArrowDown: -STEP, PageUp: 1, PageDown: -1};
    if (e.key in map) { e.preventDefault(); unlockAudio(); setValue(value + map[e.key]); rawAngle = toAngle(value); }
  });

  buildPresets(); render();
  window.GramDial = {
    get value() { return value; }, get mode() { return mode; }, get ratio() { return ratio[mode]; },
    // レシピなど外部から値を入れる
    set(v, m, r) {
      if (m === 'hot' || m === 'ice') mode = m;
      if (Number.isFinite(+v)) value = snap(+v);
      if (Number.isFinite(+r)) ratio[mode] = clamp(Math.round(+r / R_STEP) * R_STEP, R_MIN, R_MAX);
      rawAngle = toAngle(value); buildPresets(); lastTick = 0; render(); persist();
    }
  };
})();

document.getElementById('add').onclick = () => openSheet();
document.getElementById('n-date').value = new Date().toISOString().split('T')[0];
updateNStatus();
renderR();
loadStock();
</script>
